<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://cameinclutch.com/pocket/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cameinclutch.com/pocket/" />
    <meta property="og:title" content="CLUTCH Pocket (concept)" />
    <meta property="og:description" content="A smaller, vertical Clutch for anyone who goes out with just their pockets. Slate or ivory. Concept only: size, contents and price are tentative." />
    <meta property="og:image" content="https://cameinclutch.com/pocket-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>CLUTCH Pocket | Concept</title>
    <!-- Concept page: not linked from the homepage and kept out of search results. -->
    <meta name="description" content="CLUTCH Pocket, a smaller vertical pouch. Concept only: every detail is tentative and it is not for sale." />
    <meta name="theme-color" content="#ede6dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2a2b30" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const theme = localStorage.getItem('clutch-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // The page follows the system theme when storage is unavailable.
      }
    </script>
    <!-- Favicon: the logo, a black box with CLUTCH in white. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
