<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLUTCH | The going-out kit · $12 preorder</title>
    <!-- Prices are also set in src/config.js. Keep both in sync: $12 preorder, $15 retail. -->
    <meta name="description" content="CLUTCH is a going-out kit that fits a purse: drink-spike tests, condoms, a vomit bag and gum in one 4.5 × 3 in pouch. Preorder for $12; $15 at launch. Oxford College pilot, spring 2027." />
    <meta name="theme-color" content="#ede6dc" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CLUTCH" />
    <meta property="og:title" content="CLUTCH · The going-out kit · $12 preorder" />
    <meta property="og:description" content="Drink tests, condoms, a vomit bag and gum in one pouch that fits a purse. Fuchsia or bone. $12 preorder, $15 at launch." />
    <meta property="og:image" content="https://cameinclutch.com/clutch-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fuchsia and bone Clutch pouches, each with a black band reading CLUTCH in white" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const theme = localStorage.getItem('clutch-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // The site follows the system theme when storage is unavailable.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
